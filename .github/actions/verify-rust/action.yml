name: Verify Rust source
description: Shared formatting, lint, feature coverage and documentation checks
runs:
  using: composite
  steps:
    - name: Check formatting
      shell: bash
      run: cargo fmt --all -- --check

    - name: Run Clippy
      shell: bash
      run: >-
        cargo clippy --workspace --all-targets --all-features --locked --
        -D warnings
        -D clippy::future_not_send
        -D clippy::await_holding_lock
        -D clippy::large_futures
        -D clippy::perf
        -D clippy::redundant_clone
        -D clippy::needless_collect
        -D clippy::large_enum_variant
        -D clippy::manual_ok_or
        -D clippy::missing_errors_doc
        -D clippy::missing_panics_doc

    - name: Run workspace tests with all features
      shell: bash
      run: cargo test --workspace --all-features --locked

    - name: Run core tests with default features
      shell: bash
      run: cargo test --locked -p zenclash-core --lib

    - name: Test Windows authorization result classification
      if: runner.os == 'Windows'
      shell: pwsh
      run: scripts/tests/service_authorization_test.ps1

    - name: Build warning-free Rust documentation
      if: runner.os == 'Linux'
      shell: bash
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --workspace --all-features --no-deps --locked
