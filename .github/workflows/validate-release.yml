name: Validate and build release artifacts

on:
  workflow_call:
    inputs:
      mihomo_version:
        description: Optional override for the bundled and tested Mihomo release tag
        required: false
        default: ""
        type: string
    secrets:
      test_profile_url:
        description: Optional real-profile URL; the bundled profile is used when absent
        required: false
    outputs:
      version:
        description: Validated Cargo package version used in artifact names
        value: ${{ jobs.prepare.outputs.version }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  MIHOMO_VERSION: ${{ inputs.mihomo_version || 'v1.19.30' }}

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Match tag and Cargo version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "${manifest_version}" ]]; then
            echo "Workspace package version was not found" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == [vV]* ]]; then
            tag_version="${GITHUB_REF_NAME:1}"
            if [[ "${tag_version}" != "${manifest_version}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match Cargo version ${manifest_version}" >&2
              exit 1
            fi
          fi
          printf 'version=%s\n' "${manifest_version}" >>"${GITHUB_OUTPUT}"

  verify:
    name: Rust checks and real Mihomo integration
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up project Rust
        uses: ./.github/actions/setup-rust

      - name: Install Linux dependencies
        run: sudo scripts/install_linux_build_deps.sh

      - name: Run shared Rust checks
        uses: ./.github/actions/verify-rust

      - name: Prepare bundled integration profile
        shell: bash
        run: cp platforms/common/default.yaml "${RUNNER_TEMP}/real-profile.yaml"

      - name: Download verified Mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/download_mihomo.sh linux amd64 "${RUNNER_TEMP}/mihomo"

      - name: Run real Mihomo integration with the bundled profile
        env:
          ZENCLASH_MIHOMO_BINARY: ${{ runner.temp }}/mihomo
          ZENCLASH_INTEGRATION_HOME: ${{ runner.temp }}/mihomo-home
          ZENCLASH_CONFIG: ${{ runner.temp }}/real-profile.yaml
        run: cargo test --locked --all-features -p zenclash-core --test real_mihomo -- --ignored --nocapture

      - name: Prepare optional private integration profile
        id: private_profile
        shell: bash
        env:
          PROFILE_URL: ${{ secrets.test_profile_url }}
        run: |
          set -euo pipefail
          if [[ -z "${PROFILE_URL}" ]]; then
            printf 'available=false\n' >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          curl --fail --silent --show-error --location --retry 3 \
            --header 'Accept: text/yaml, application/yaml, text/plain, */*' \
            --header 'User-Agent: clash.meta' \
            "${PROFILE_URL}" --output "${RUNNER_TEMP}/private-profile.yaml"
          printf 'available=true\n' >>"${GITHUB_OUTPUT}"

      - name: Run the optional private-profile Mihomo integration test
        if: steps.private_profile.outputs.available == 'true'
        env:
          ZENCLASH_MIHOMO_BINARY: ${{ runner.temp }}/mihomo
          ZENCLASH_INTEGRATION_HOME: ${{ runner.temp }}/mihomo-private-home
          ZENCLASH_CONFIG: ${{ runner.temp }}/private-profile.yaml
        run: >-
          cargo test --locked --all-features -p zenclash-core --test real_mihomo
          drives_the_supplied_profile_through_a_real_mihomo_process --
          --exact --ignored --nocapture

  macos:
    name: macOS Apple Silicon binaries
    needs: [prepare, verify]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up project Rust
        uses: ./.github/actions/setup-rust
        with:
          target: aarch64-apple-darwin

      - name: Run shared Rust checks
        uses: ./.github/actions/verify-rust

      - name: Build binaries with Cargo
        run: |
          cargo build --release --locked -p zenclash-ui --bin zenclash --target aarch64-apple-darwin
          cargo build --release --locked -p zenclash-service --features standalone,client --bin zenclash-service --bin zenclash-service-install --bin zenclash-service-uninstall --target aarch64-apple-darwin

      - name: Download verified bundled Mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/download_mihomo.sh darwin arm64 "${{ runner.temp }}/mihomo"

      - name: Archive macOS binaries
        shell: bash
        run: |
          set -euo pipefail
          name="ZenClash-${{ needs.prepare.outputs.version }}-macOS-arm64"
          mkdir -p "dist/${name}/bin" "dist/${name}/Resources"
          for binary in zenclash zenclash-service zenclash-service-install zenclash-service-uninstall; do
            test -s "target/aarch64-apple-darwin/release/${binary}"
            cp "target/aarch64-apple-darwin/release/${binary}" "dist/${name}/bin/"
          done
          cp "${{ runner.temp }}/mihomo" "dist/${name}/Resources/mihomo"
          "dist/${name}/Resources/mihomo" -v
          cp platforms/common/default.yaml "dist/${name}/Resources/profile.yaml"
          cp platforms/common/recovery.yaml platforms/macos/ZenClash.png "dist/${name}/Resources/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"

      - name: Upload macOS binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zenclash-macos-arm64
          path: dist/ZenClash-${{ needs.prepare.outputs.version }}-macOS-arm64.tar.gz
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows x64 binaries
    needs: [prepare, verify]
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up project Rust
        uses: ./.github/actions/setup-rust
        with:
          target: x86_64-pc-windows-msvc

      - name: Run shared Rust checks
        uses: ./.github/actions/verify-rust

      - name: Build binaries with Cargo
        shell: pwsh
        run: |
          cargo build --release --locked -p zenclash-ui --bin zenclash --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "GUI Cargo build failed" }
          cargo build --release --locked -p zenclash-service --features standalone,client --bin zenclash-service --bin zenclash-service-install --bin zenclash-service-uninstall --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "Service Cargo build failed" }

      - name: Download verified bundled Mihomo
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/download_mihomo.ps1 -OutputPath "$env:RUNNER_TEMP/mihomo.exe"

      - name: Archive Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Name = "ZenClash-${{ needs.prepare.outputs.version }}-windows-x64"
          $Stage = Join-Path 'dist' $Name
          $Resources = Join-Path $Stage 'resources'
          New-Item -ItemType Directory -Force -Path $Resources | Out-Null
          foreach ($Binary in @('zenclash', 'zenclash-service', 'zenclash-service-install', 'zenclash-service-uninstall')) {
            $Source = "target/x86_64-pc-windows-msvc/release/$Binary.exe"
            if (-not (Test-Path -LiteralPath $Source -PathType Leaf) -or (Get-Item -LiteralPath $Source).Length -eq 0) {
              throw "Cargo binary is missing or empty: $Source"
            }
            Copy-Item -LiteralPath $Source -Destination $Stage
          }
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/mihomo.exe" -Destination (Join-Path $Resources 'mihomo.exe')
          & (Join-Path $Resources 'mihomo.exe') -v
          if ($LASTEXITCODE -ne 0) { throw "Bundled Mihomo cannot run" }
          Copy-Item -LiteralPath 'platforms/common/default.yaml' -Destination (Join-Path $Resources 'profile.yaml')
          Copy-Item -LiteralPath 'platforms/common/recovery.yaml', 'platforms/macos/ZenClash.png' -Destination $Resources
          Compress-Archive -LiteralPath $Stage -DestinationPath "dist/$Name.zip" -Force

      - name: Upload Windows binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zenclash-windows-x64
          path: dist/ZenClash-${{ needs.prepare.outputs.version }}-windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  ubuntu:
    name: Ubuntu 24.04+ binaries
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up project Rust
        uses: ./.github/actions/setup-rust

      - name: Install Linux dependencies
        run: sudo scripts/install_linux_build_deps.sh

      - name: Run shared Rust checks
        uses: ./.github/actions/verify-rust

      - name: Build binaries with Cargo
        run: |
          cargo build --release --locked -p zenclash-ui --bin zenclash
          cargo build --release --locked -p zenclash-service --features standalone,client --bin zenclash-service --bin zenclash-service-install --bin zenclash-service-uninstall

      - name: Download verified bundled Mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/download_mihomo.sh linux amd64 "${{ runner.temp }}/mihomo"

      - name: Archive Ubuntu binaries
        shell: bash
        run: |
          set -euo pipefail
          name="ZenClash-${{ needs.prepare.outputs.version }}-Ubuntu-24.04+-amd64"
          mkdir -p "dist/${name}/resources"
          for binary in zenclash zenclash-service zenclash-service-install zenclash-service-uninstall; do
            test -s "target/release/${binary}"
            cp "target/release/${binary}" "dist/${name}/"
          done
          cp "${{ runner.temp }}/mihomo" "dist/${name}/resources/mihomo"
          "dist/${name}/resources/mihomo" -v
          cp platforms/common/default.yaml "dist/${name}/resources/profile.yaml"
          cp platforms/common/recovery.yaml platforms/macos/ZenClash.png "dist/${name}/resources/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"

      - name: Upload Ubuntu binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zenclash-ubuntu-24.04-amd64
          path: dist/ZenClash-${{ needs.prepare.outputs.version }}-Ubuntu-24.04+-amd64.tar.gz
          if-no-files-found: error
          compression-level: 0
