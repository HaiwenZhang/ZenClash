name: Validate and build release artifacts

on:
  workflow_call:
    inputs:
      mihomo_version:
        description: Optional override for the bundled and tested Mihomo release tag
        required: false
        default: ""
        type: string
    secrets:
      test_profile_url:
        description: Optional real-profile URL; the bundled profile is used when absent
        required: false
    outputs:
      version:
        description: Validated Cargo package version used in artifact names
        value: ${{ jobs.prepare.outputs.version }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  MIHOMO_VERSION: ${{ inputs.mihomo_version || 'v1.19.30' }}

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Match tag and Cargo version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "${manifest_version}" ]]; then
            echo "Workspace package version was not found" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == [vV]* ]]; then
            tag_version="${GITHUB_REF_NAME:1}"
            if [[ "${tag_version}" != "${manifest_version}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match Cargo version ${manifest_version}" >&2
              exit 1
            fi
          fi
          printf 'version=%s\n' "${manifest_version}" >>"${GITHUB_OUTPUT}"

  msrv:
    name: Minimum supported Rust version
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up minimum Rust
        uses: ./.github/actions/setup-rust
        with:
          version: "1.98.1"

      - name: Install Linux dependencies
        run: sudo scripts/install_linux_build_deps.sh

      - name: Check workspace on the declared MSRV
        run: cargo check --workspace --all-features --locked

  verify:
    name: Rust checks and real Mihomo integration
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up project Rust
        uses: ./.github/actions/setup-rust

      - name: Install Linux dependencies
        run: sudo scripts/install_linux_build_deps.sh

      - name: Run shared Rust checks
        uses: ./.github/actions/verify-rust

      - name: Prepare bundled integration profile
        shell: bash
        run: cp platforms/common/default.yaml "${RUNNER_TEMP}/real-profile.yaml"

      - name: Download verified Mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/download_mihomo.sh linux amd64 "${RUNNER_TEMP}/mihomo"

      - name: Run real Mihomo integration with the bundled profile
        env:
          ZENCLASH_MIHOMO_BINARY: ${{ runner.temp }}/mihomo
          ZENCLASH_INTEGRATION_HOME: ${{ runner.temp }}/mihomo-home
          ZENCLASH_CONFIG: ${{ runner.temp }}/real-profile.yaml
        run: cargo test --locked --all-features -p zenclash-core --test real_mihomo -- --ignored --nocapture

      - name: Prepare optional private integration profile
        id: private_profile
        shell: bash
        env:
          PROFILE_URL: ${{ secrets.test_profile_url }}
        run: |
          set -euo pipefail
          if [[ -z "${PROFILE_URL}" ]]; then
            printf 'available=false\n' >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          curl --fail --silent --show-error --location --retry 3 \
            --header 'Accept: text/yaml, application/yaml, text/plain, */*' \
            --header 'User-Agent: clash.meta' \
            "${PROFILE_URL}" --output "${RUNNER_TEMP}/private-profile.yaml"
          printf 'available=true\n' >>"${GITHUB_OUTPUT}"

      - name: Run the optional private-profile Mihomo integration test
        if: steps.private_profile.outputs.available == 'true'
        env:
          ZENCLASH_MIHOMO_BINARY: ${{ runner.temp }}/mihomo
          ZENCLASH_INTEGRATION_HOME: ${{ runner.temp }}/mihomo-private-home
          ZENCLASH_CONFIG: ${{ runner.temp }}/private-profile.yaml
        run: >-
          cargo test --locked --all-features -p zenclash-core --test real_mihomo
          drives_the_supplied_profile_through_a_real_mihomo_process --
          --exact --ignored --nocapture

  macos:
    name: macOS Apple Silicon installer
    needs: [prepare, verify]
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up project Rust
        uses: ./.github/actions/setup-rust
        with:
          target: aarch64-apple-darwin

      - name: Run shared Rust checks
        uses: ./.github/actions/verify-rust

      - name: Test macOS application packaging
        run: bash scripts/tests/build_macos_app_test.sh

      - name: Build macOS DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/build_macos_package.sh '${{ needs.prepare.outputs.version }}' dist

      - name: Upload macOS DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zenclash-macos-arm64
          path: dist/ZenClash-${{ needs.prepare.outputs.version }}-macOS-arm64.dmg
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows ${{ matrix.arch }} installer
    needs: [prepare, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up project Rust
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}

      - name: Run shared Rust checks
        uses: ./.github/actions/verify-rust

      - name: Test Windows installer packaging
        shell: pwsh
        run: scripts/tests/build_windows_installer_test.ps1 -Architecture '${{ matrix.arch }}'

      - name: Build Windows setup installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/build_windows_installer.ps1
          -Version '${{ needs.prepare.outputs.version }}'
          -Architecture '${{ matrix.arch }}'
          -OutputDir dist

      - name: Upload Windows setup installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zenclash-windows-${{ matrix.arch }}
          path: dist/ZenClash-${{ needs.prepare.outputs.version }}-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
          compression-level: 0

  ubuntu:
    name: Ubuntu 24.04+ ${{ matrix.arch }} package
    needs: [prepare, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up project Rust
        uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}

      - name: Install Linux dependencies
        run: sudo scripts/install_linux_build_deps.sh

      - name: Run shared Rust checks
        # The prerequisite verify job already checks the amd64 runner.
        if: matrix.arch == 'arm64'
        uses: ./.github/actions/verify-rust

      - name: Test Debian packaging
        run: scripts/tests/build_deb_package_test.sh '${{ matrix.arch }}'

      - name: Build Ubuntu Debian package
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/build_deb_package.sh '${{ needs.prepare.outputs.version }}' dist

      - name: Upload Ubuntu Debian package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zenclash-ubuntu-24.04-${{ matrix.arch }}
          path: dist/ZenClash-${{ needs.prepare.outputs.version }}-Ubuntu-24.04+-${{ matrix.arch }}.deb
          if-no-files-found: error
          compression-level: 0
