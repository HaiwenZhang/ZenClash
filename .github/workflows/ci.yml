name: Continuous integration

on:
  push:
    branches-ignore:
      - "v*"
      - "v*/**"
      - "V*"
      - "V*/**"
    tags-ignore:
      - "v*"
      - "V*"
  pull_request:
    branches-ignore:
      - "v*"
      - "v*/**"
      - "V*"
      - "V*/**"
  workflow_dispatch:
    inputs:
      mihomo_version:
        description: Mihomo tag override; leave blank for the shared default
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  verify:
    # PR filters inspect the base; case-insensitive startsWith also covers V.
    if: >-
      ${{ !startsWith(github.ref_name, 'v') &&
      !startsWith(github.head_ref, 'v') }}
    uses: ./.github/workflows/validate-release.yml
    with:
      mihomo_version: ${{ inputs.mihomo_version }}
    secrets:
      test_profile_url: ${{ secrets.ZENCLASH_TEST_PROFILE_URL }}
