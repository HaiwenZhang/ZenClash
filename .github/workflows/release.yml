name: Build and publish release

on:
  push:
    branches:
      - "v*"
      - "v*/**"
      - "V*"
      - "V*/**"
    tags:
      - "v*"
      - "V*"
  workflow_dispatch:
    inputs:
      mihomo_version:
        description: Mihomo tag override; leave blank for the shared default
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate-release.yml
    with:
      mihomo_version: ${{ inputs.mihomo_version }}
    secrets:
      test_profile_url: ${{ secrets.ZENCLASH_TEST_PROFILE_URL }}

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download platform installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
          pattern: zenclash-*

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.dmg ./*-setup.exe ./*.deb >SHA256SUMS

      - name: Attest release artifacts
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --verify-tag \
              --generate-notes \
              --title "ZenClash ${RELEASE_TAG}"
          fi
