[workspace]
members = [
    "crates/zenclash-core",
    "crates/zenclash-i18n",
    "crates/zenclash-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["ZenClash contributors"]
license = "GPL-3.0-only"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cron = "0.15"
futures-util = "0.3"
getrandom = "0.3"
flate2 = "1.1"
# Compile Metal source at application startup on macOS. This keeps development
# builds working on Xcode installations where the optional offline Metal
# toolchain component is not installed.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
http = "1.1"
libc = "0.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
parking_lot = "0.12"
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
roxmltree = "0.20"
rust-i18n = "4"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
socket2 = "0.6"
thiserror = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.24.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinInet",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
zenclash-i18n = { path = "crates/zenclash-i18n" }

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
