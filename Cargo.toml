[workspace]
members = [
    "crates/zenclash-core",
    "crates/zenclash-i18n",
    "crates/zenclash-service",
    "crates/zenclash-service-integration",
    "crates/zenclash-ui",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["ZenClash contributors"]
license = "GPL-3.0-only"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cron = "0.15"
futures-util = "0.3"
getrandom = "0.3"
flate2 = "1.1"
gpui-kit = { version = "0.7", features = ["tree-sitter-yaml"] }
http = "1.1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
parking_lot = "0.12"
raw-window-handle = "0.6"
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rust-i18n = "4"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
socket2 = "0.6"
thiserror = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.24.2"
url = "2"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinInet",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_WindowsAndMessaging",
] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
zenclash-i18n = { path = "crates/zenclash-i18n" }

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
