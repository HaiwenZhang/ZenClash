[workspace]
members = [
    "crates/zenclash-core",
    "crates/zenclash-i18n",
    "crates/zenclash-service",
    "crates/zenclash-ui",
]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.98"
authors = ["ZenClash contributors"]
license = "GPL-3.0-only"

[workspace.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cron = "0.17.0"
futures-util = "0.3.34"
getrandom = "0.4.3"
flate2 = "1.1.10"
gpui-kit = { version = "0.7.3", features = ["gpui-fast", "tree-sitter-yaml"] }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2.190"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
parking_lot = "0.12.5"
raw-window-handle = "0.6.2"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "stream"] }
rust-i18n = "4.2.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
socket2 = "0.6.5"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = { version = "0.26.0", default-features = false }
url = "2.5.8"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinInet",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_WindowsAndMessaging",
] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
zenclash-i18n = { path = "crates/zenclash-i18n" }

# Keep the CI lint policy enforceable from a plain `cargo clippy`.
# `.github/actions/verify-rust/action.yml` repeats these flags so the exact
# command remains visible in review tools and release logs.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"
future_not_send = "deny"
large_enum_variant = "deny"
large_futures = "deny"
manual_ok_or = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
needless_collect = "deny"
perf = "deny"
redundant_clone = "deny"

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
