    rule_filter:
      zh-CN: 过滤规则类型、内容或策略…
      en: Filter by rule type, content, or policy…
  lifecycle:
    proxy_reconcile:
      zh-CN: 系统代理与新内核配置同步失败：%{error}
      en: "Could not synchronize the system proxy with the new core configuration: %{error}"
    profile_updated:
