    zh-CN: 简体中文
    en: Simplified Chinese
  en:
    zh-CN: English
    en: English
  saved:
    zh-CN: 界面语言已切换为简体中文
    en: Interface language changed to English

sidebar:
  collapse:
    zh-CN: 收起侧边栏
    en: Collapse sidebar
  expand:
    zh-CN: 展开侧边栏
    en: Expand sidebar

navigation:
  home:
    label:
      zh-CN: 首页
      en: Home
    subtitle:
      zh-CN: 一眼确认当前订阅、节点、代理模式与网络活动。
      en: Review the active profile, node, proxy mode, and network activity at a glance.
  system_proxy:
    label:
      zh-CN: 系统代理
      en: System Proxy
    subtitle:
      zh-CN: 配置操作系统 HTTP/HTTPS 代理与绕过地址。
      en: Configure the operating system HTTP/HTTPS proxy and bypass list.
  tun:
    label:
      zh-CN: 虚拟网卡
      en: TUN
    subtitle:
      zh-CN: 管理当前内核的 TUN 虚拟网卡、路由与权限。
      en: Manage the active core's TUN interface, routing, and permissions.
  profiles:
    label:
      zh-CN: 订阅管理
      en: Profiles
    subtitle:
      zh-CN: 添加、更新、编辑并切换本地或远程订阅。
      en: Add, update, edit, and activate local or remote profiles.
  proxies:
    label:
      zh-CN: 代理组
      en: Proxies
    subtitle:
      zh-CN: 查看代理组、切换节点并执行延迟测试。
      en: Browse proxy groups, switch nodes, and run delay tests.
  mihomo:
    label:
      zh-CN: 内核设置
      en: Core
    subtitle:
      zh-CN: 管理内核版本、启动参数与控制器设置。
      en: Manage the core version, launch options, and controller settings.
  connections:
    label:
      zh-CN: 连接
      en: Connections
    subtitle:
      zh-CN: 查看实时连接、速率、规则链并关闭连接。
      en: Inspect live connections, traffic, routing chains, and close sessions.
  dns:
    label:
      zh-CN: DNS 覆写
      en: DNS Override
    subtitle:
      zh-CN: 配置 DNS 监听、上游服务器、Fake-IP 与回退策略。
      en: Configure DNS listeners, upstream servers, Fake-IP, and fallback policy.
  sniffer:
    label:
      zh-CN: 嗅探覆写
      en: Sniffer Override
    subtitle:
      zh-CN: 配置 TLS、HTTP、QUIC 域名嗅探规则。
      en: Configure TLS, HTTP, and QUIC hostname sniffing.
  logs:
    label:
      zh-CN: 日志
      en: Logs
    subtitle:
      zh-CN: 筛选并跟踪当前内核的实时日志。
      en: Filter and follow the active core's live logs.
  rules:
    label:
      zh-CN: 规则
      en: Rules
    subtitle:
      zh-CN: 浏览当前运行时规则和命中策略。
      en: Browse active routing rules and matched policies.
  resources:
    label:
      zh-CN: 外部资源
      en: Resources
    subtitle:
      zh-CN: 更新代理提供者、规则提供者与 GeoData。
      en: Update proxy providers, rule providers, and GeoData.
  override:
    label:
      zh-CN: 覆写
      en: Overrides
    subtitle:
      zh-CN: 按顺序管理托管 YAML 覆写并预览最终配置。
      en: Manage ordered YAML overrides and preview the effective configuration.
  network:
    label:
      zh-CN: 网络信息
      en: Network
    subtitle:
      zh-CN: 查看网络接口、出口地址和连通性。
      en: Inspect network interfaces, public addresses, and connectivity.
  traffic:
    label:
      zh-CN: 用量
      en: Usage
    subtitle:
      zh-CN: 按主机、来源、出站和进程分析历史用量。
      en: Analyze historical usage by host, source, outbound, and process.
  settings:
    label:
      zh-CN: 应用设置
      en: Settings
    subtitle:
      zh-CN: 配置运行内核、主题、状态栏、流量历史与备份。
      en: Configure the runtime core, appearance, status menu, traffic history, and backups.

