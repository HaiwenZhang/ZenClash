app:
  name:
    zh-CN: ZenClash
    en: ZenClash
  description:
    zh-CN: Mihomo 客户端
    en: Mihomo Client
  menu:
    title:
      zh-CN: ZenClash
      en: ZenClash
    quit:
      zh-CN: 退出 ZenClash
      en: Quit ZenClash
  directories:
    config:
      zh-CN: 配置文件目录
      en: Configuration Directory
    data:
      zh-CN: 应用数据目录
      en: Application Data Directory
    core_working:
      zh-CN: "%{core} 工作目录"
      en: "%{core} Working Directory"
    resources:
      zh-CN: 内核与资源目录
      en: Core & Resources Directory
  errors:
    preferences_unavailable:
      zh-CN: 应用设置存储不可用
      en: Application preferences are unavailable
    profile_update_task:
      zh-CN: 自动更新任务异常结束：%{error}
      en: "The automatic update task ended unexpectedly: %{error}"
    scheduled_backup_directory:
      zh-CN: 定时备份目录任务异常结束：%{error}
      en: "The scheduled backup directory task ended unexpectedly: %{error}"
  system_proxy:
    errors:
      offline_release_task:
        zh-CN: 离线恢复时关闭系统代理任务异常结束：%{error}
        en: "The system proxy release task during offline recovery ended unexpectedly: %{error}"
      missing_port_released:
        zh-CN: 新配置没有可用的 Mixed/HTTP 端口，ZenClash 已安全关闭系统代理
        en: The new configuration has no usable Mixed/HTTP port; ZenClash safely disabled the system proxy
      invalid_release_task:
        zh-CN: 关闭失效系统代理任务异常结束：%{error}
        en: "The invalid system proxy release task ended unexpectedly: %{error}"
      ownership_missing:
        zh-CN: 系统代理恢复成功但没有返回所有权证据
        en: The system proxy was restored, but no ownership evidence was returned
      ownership_save_released:
        zh-CN: 保存系统代理所有权失败：%{error}；系统代理已安全关闭
        en: "Could not save system proxy ownership: %{error}; the system proxy was safely disabled"
      ownership_save_release_failed:
        zh-CN: 保存系统代理所有权失败：%{error}；安全关闭也失败：%{release_error}
        en: "Could not save system proxy ownership: %{error}; safe shutdown also failed: %{release_error}"
      restore_task:
        zh-CN: 系统代理恢复任务异常结束：%{error}
        en: "The system proxy restore task ended unexpectedly: %{error}"
      quit_release:
        zh-CN: 关闭系统代理失败：%{error}
        en: "Could not disable the system proxy: %{error}"
      quit_release_task:
        zh-CN: 退出前关闭系统代理任务异常结束：%{error}
        en: "The pre-quit system proxy release task ended unexpectedly: %{error}"
      quit_core:
        zh-CN: 停止内核失败：%{error}
        en: "Could not stop the core: %{error}"
      quit_core_task:
        zh-CN: 退出前停止内核任务异常结束：%{error}
        en: "The pre-quit core stop task ended unexpectedly: %{error}"

startup:
  separator:
    zh-CN: ；
    en: "; "
  failure:
    zh-CN: ZenClash 启动失败：%{error}
    en: "ZenClash failed to start: %{error}"
  quarantine:
    profile_index:
      zh-CN: 损坏的配置索引已隔离到 %{path}，托管 YAML 文件仍保留
      en: The damaged profile index was quarantined at %{path}; managed YAML files were preserved
    controlled_config:
      zh-CN: 损坏的受控配置已隔离到 %{path}，本次从空受控层恢复
      en: The damaged managed configuration was quarantined at %{path}; this run recovered with an empty managed layer
    overrides:
      zh-CN: 损坏的 YAML 覆写清单已隔离到 %{path}，托管 YAML 文件仍保留
      en: The damaged YAML override catalog was quarantined at %{path}; managed YAML files were preserved
    preferences:
      zh-CN: 损坏或不兼容的应用设置已隔离到 %{path}，本次从默认设置恢复
      en: Damaged or incompatible application preferences were quarantined at %{path}; this run recovered with defaults
  automatic_discovery:
    zh-CN: 自动发现
    en: Automatic discovery
  core_recovered:
    zh-CN: 首选 %{requested} 启动失败，已明确恢复到 %{recovered}（%{source}）。首选项没有被覆盖，请在“设置 → 运行内核”重新检测或选择文件。原因：%{error}
    en: "Preferred core %{requested} failed to start and ZenClash explicitly recovered with %{recovered} (%{source}). The preference was not overwritten; detect again or select a file under Settings → Runtime Core. Reason: %{error}"
  restart_failed:
    zh-CN: ZenClash 已退出，但无法从 %{path} 重新启动：%{error}
    en: "ZenClash exited but could not restart from %{path}: %{error}"
  explicit_core:
    zh-CN: 无法启动显式选择的 %{core}：%{error}
    en: "Could not start the explicitly selected %{core}: %{error}"
  listener_fallback:
    zh-CN: 检测到监听端口被其他进程占用，本次运行已临时改用 %{changes}；订阅和持久设置未修改。
    en: Listener ports were already used by another process. This run temporarily uses %{changes}; profiles and persistent settings were not changed.
  active_invalid:
    zh-CN: "%{core} 的活动配置无效：%{error}"
    en: "The active %{core} configuration is invalid: %{error}"
  active_precheck:
    zh-CN: "%{core} 的活动配置未通过内核预检：%{error}"
    en: "The active %{core} configuration failed core validation: %{error}"
  controller_allocation:
    zh-CN: 无法为托管 %{core} 分配隔离控制器，已拒绝连接固定或无鉴权控制器：%{error}
    en: "Could not allocate an isolated controller for managed %{core}; ZenClash refused a fixed or unauthenticated controller: %{error}"
  managed_spawn:
    zh-CN: 无法启动托管 %{core}：%{error}
    en: "Could not start managed %{core}: %{error}"
  managed_not_ready_stop:
    zh-CN: 托管 %{core} 未能就绪：%{error}；停止失败：%{stop_error}
    en: "Managed %{core} did not become ready: %{error}; stopping it also failed: %{stop_error}"
  managed_not_ready:
    zh-CN: 托管 %{core} 未能就绪：%{error}
    en: "Managed %{core} did not become ready: %{error}"
  controller_contended:
    zh-CN: 托管 %{core} 控制器连续 %{count} 次被抢占
    en: The managed %{core} controller was taken %{count} consecutive times
  workspace:
    zh-CN: 无法从 Cargo 清单路径确定 ZenClash 工作区
    en: Could not determine the ZenClash workspace from the Cargo manifest path
  offline:
    zh-CN: 所有可用内核都启动失败，ZenClash 已进入离线恢复模式，未连接默认 9090 控制器。请在“设置 → 运行内核”重新检测或选择可执行文件，然后重启应用。原因：%{error}
    en: "All available cores failed to start. ZenClash entered offline recovery mode without connecting to a default port 9090 controller. Detect again or select an executable under Settings → Runtime Core, then restart the app. Reason: %{error}"
  all_cores_failed:
    zh-CN: 首选内核与恢复内核均启动失败：%{errors}
    en: "The preferred and recovery cores all failed to start: %{errors}"
  recovery_missing:
    zh-CN: 活动配置启动失败，且内置恢复配置缺失：%{path}；原始原因：%{cause}
    en: "The active profile failed to start and the bundled recovery profile is missing at %{path}; original reason: %{cause}"
  recovery_active:
    zh-CN: 活动配置未能启动，已使用内置直连恢复配置运行 %{core}；原活动选择和源文件均未改写。请在“配置”页导入或切换到有效配置。原因：%{cause}
    en: "The active profile failed to start, so %{core} is running with the bundled direct recovery profile. The active selection and source file were not modified. Import or select a valid profile on the Profiles page. Reason: %{cause}"
  recovery_failed:
    zh-CN: 活动配置与内置恢复配置均启动失败：%{errors}
    en: "The active and bundled recovery profiles both failed to start: %{errors}"

language:
  title:
    zh-CN: 语言
    en: Language
  description:
