      en: Live stream connected
    reconnecting:
      zh-CN: 实时流重连中
      en: Reconnecting live stream
  empty:
    loading:
      zh-CN: 正在从内核读取真实状态…
      en: Loading live state from the core…
    unavailable:
      zh-CN: 当前没有可显示的内核状态，请检查上方错误后重试。
      en: No core state is available. Review the error above and try again.
  placeholders:
    network_target:
      zh-CN: 例如：公司网关
      en: "For example: Office Gateway"
    dns_name:
      zh-CN: 例如：example.com
      en: "For example: example.com"
    connection_filter:
      zh-CN: 过滤域名、IP、进程或规则…
      en: Filter by domain, IP, process, or rule…
