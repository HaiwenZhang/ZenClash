# Modified for the ZenClash fork on 2026-10-04; see NOTICE.md. GPL-3.0-only.
[package]
name = "zenclash-service"
version = "2.7.5+zenclash.1"
edition = "2024"
authors = ["Tunglies", "ZenClash contributors"]
license = "GPL-3.0-only"
readme = "README.md"
description = "ZenClash privileged IPC service, forked from clash-verge-service-ipc"
repository = "https://github.com/HaiwenZhang/ZenClash"
publish = false

[lib]
name = "zenclash_service"
path = "src/lib.rs"

[[bin]]
name = "zenclash-service"
path = "src/bin/service.rs"
required-features = ["standalone"]

[[bin]]
name = "zenclash-service-install"
path = "src/bin/install_service.rs"
required-features = ["standalone", "client"]

[[bin]]
name = "zenclash-service-uninstall"
path = "src/bin/uninstall_service.rs"
required-features = ["standalone"]

[[bin]]
name = "mock_binary"
path = "src/bin/mock_binary.rs"
required-features = ["test"]

[[bin]]
name = "crash_binary"
path = "src/bin/crash_binary.rs"
required-features = ["test"]

[[bin]]
name = "owner_lock_holder"
path = "src/bin/owner_lock_holder.rs"
required-features = ["standalone", "test"]

[[bin]]
name = "service-integration-driver"
path = "src/bin/service_integration_driver.rs"
required-features = ["client"]

[features]
development-channel = []
standalone = [
    "kode-bridge",
    "kode-bridge/client",
    "http",
    "tracing",
    "tracing-subscriber",
    "tokio",
    "anyhow",
    "once_cell",
    "serde_json",
    "dep:tracing-estuary",
    "dep:parking_lot",
    "flexi_logger",
    "log",
    "response",
    "dep:platform_lib",
    "dep:nix",
    "dep:windows-sys",
]
client = [
    "kode-bridge/client",
    "anyhow",
    "log",
    "tokio",
    "once_cell",
    "serde_json",
    "response",
    "dep:platform_lib",
    "dep:windows-sys",
]
response = []
test = [
    "anyhow",
    "dep:platform_lib",
    "dep:windows-sys",
]
default = []


[dependencies]
kode-bridge = { version = "0.5.2", features = ["server"], optional = true }
once_cell = { version = "1.21.4", features = ["parking_lot"], optional = true }
anyhow = { version = "1.0.104", optional = true }
http = { version = "1.5.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
sha2 = "0.11.0"
strum = { version = "0.28.0" }
strum_macros = { version = "0.28.0" }
tokio = { version = "1.53.2", features = [
    "process",
    "io-util",
    "rt-multi-thread",
    "macros",
    "signal",
    "fs",
    "time",
], optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", optional = true }
tracing-estuary = { git = "https://github.com/Tunglies/tracing-estuary.git", branch = "main", optional = true }
flexi_logger = { version = "0.31.10", optional = true }
log = { version = "0.4.34", optional = true }
parking_lot = { version = "0.12.5", optional = true }
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
sysproxy = { git = "https://github.com/clash-verge-rev/sysproxy-rs.git", branch = "main", default-features = false }

[target.'cfg(unix)'.dependencies]
platform_lib = { package = "libc", version = "0.2.190", optional = true }
nix = { version = "0.31.3", features = ["user"], optional = true }

[target.'cfg(windows)'.dependencies]
platform_lib = { package = "windows-service", version = "0.8.1", optional = true }
windows-sys = { version = "0.61.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
] }

[dev-dependencies]
kode-bridge = { version = "0.5.2", default-features = false, features = [
    "server",
    "client",
] }
serde_json = "1.0.151"
serial_test = "4.0.1"
