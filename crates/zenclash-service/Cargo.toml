# Modified for the ZenClash fork on 2026-10-04; see NOTICE.md. GPL-3.0-only.
[package]
name = "zenclash-service"
version = "2.7.5+zenclash.2"
edition = "2024"
rust-version = "1.99"
authors = ["Tunglies", "ZenClash contributors"]
license = "GPL-3.0-only"
readme = "README.md"
description = "ZenClash privileged IPC service, forked from clash-verge-service-ipc"
repository = "https://github.com/HaiwenZhang/ZenClash"
publish = false

[lints]
workspace = true

[lib]
name = "zenclash_service"
path = "src/lib.rs"

[[bin]]
name = "zenclash-service"
path = "src/bin/service.rs"
required-features = ["standalone"]

[[bin]]
name = "zenclash-service-install"
path = "src/bin/install_service.rs"
required-features = ["standalone", "client"]

[[bin]]
name = "zenclash-service-uninstall"
path = "src/bin/uninstall_service.rs"
required-features = ["standalone"]

[[bin]]
name = "mock_binary"
path = "tests/support/mock_binary.rs"
required-features = ["test"]

[[bin]]
name = "crash_binary"
path = "tests/support/crash_binary.rs"
required-features = ["test"]

[[bin]]
name = "owner_lock_holder"
path = "tests/support/owner_lock_holder.rs"
required-features = ["standalone", "test"]

[[bin]]
name = "service-integration-driver"
path = "src/bin/service_integration_driver.rs"
required-features = ["client"]

[[test]]
name = "service_integration"
path = "tests/service_integration/main.rs"
required-features = ["standalone", "client"]

[features]
development-channel = []
standalone = [
    "kode-bridge",
    "kode-bridge/client",
    "http",
    "tracing",
    "tracing-subscriber",
    "tokio",
    "anyhow",
    "serde_json",
    "dep:serde_yaml",
    "dep:parking_lot",
    "response",
    "dep:platform_lib",
    "dep:nix",
    "dep:windows-sys",
    "dep:block2",
    "dep:system-configuration",
]
client = [
    "kode-bridge/client",
    "anyhow",
    "tracing",
    "tokio",
    "serde_json",
    "response",
    "dep:platform_lib",
    "dep:windows-sys",
    "dep:block2",
    "dep:parking_lot",
]
response = []
test = [
    "anyhow",
    "dep:platform_lib",
    "dep:windows-sys",
]
default = []

[dependencies]
kode-bridge = { version = "0.5.2", features = ["server"], optional = true }
anyhow = { version = "1.0.104", optional = true }
http = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
sha2 = { workspace = true }
strum = { version = "0.28.0" }
strum_macros = { version = "0.28.0" }
tokio = { workspace = true, features = ["process", "signal"], optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", optional = true }
system-configuration = { version = "0.8.0", optional = true }

[target.'cfg(unix)'.dependencies]
platform_lib = { package = "libc", version = "0.2.191", optional = true }
nix = { version = "0.31.3", features = ["user"], optional = true }

[target.'cfg(windows)'.dependencies]
platform_lib = { package = "windows-service", version = "0.8.1", optional = true }
windows-sys = { version = "0.61.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
kode-bridge = { version = "0.5.2", default-features = false, features = [
    "server",
    "client",
] }
serde_json = { workspace = true }
serial_test = "4.0.1"
