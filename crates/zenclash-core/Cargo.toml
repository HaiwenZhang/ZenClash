[package]
name = "zenclash-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
test-support = []
# Isolated Fork IPC and simulated core. Never enable for production packaging.
service-ipc-tests = ["zenclash-service-integration/ipc-tests"]

[dependencies]
anyhow = "1.0"
chrono.workspace = true
cron.workspace = true
flate2.workspace = true
futures-util.workspace = true
getrandom.workspace = true
http.workspace = true
parking_lot.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
socket2.workspace = true
sysinfo = { version = "0.31.4", default-features = false, features = ["system"] }
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-webpki-roots"] }
tracing.workspace = true
zip.workspace = true
zenclash-i18n.workspace = true
zenclash-service = { path = "../zenclash-service", features = ["client"] }
zenclash-service-integration = { path = "../zenclash-service-integration" }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }


[[bin]]
name = "zenclash-core-integration-test-core"
path = "tests/support/mock_core.rs"
required-features = ["service-ipc-tests"]

[[test]]
name = "native_service_session"
path = "tests/native_service_session.rs"
required-features = ["service-ipc-tests"]
